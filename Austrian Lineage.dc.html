<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Poiret+One&amp;family=Figtree:wght@400;500;600&amp;display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>
html,body{margin:0;background:#F3F2EE;}
a{color:#000000;text-decoration:none;}
a:hover{color:#555555;}
</style>
</helmet>
<div style="height:{{ m.wrapH }}; min-height:calc(100vh - 70px); overflow:{{ m.wrapOverflow }}; box-sizing:border-box; max-width:1120px; margin:0 auto; padding:{{ m.wrapPad }}; background:#F3F2EE; color:#111111; font-family:'Newsreader', Georgia, serif; display:flex; flex-direction:column; gap:clamp(10px,1.6vh,18px);">
  <header style="flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;">
    <a href="#" onClick="{{ onHome }}" style="display:flex; flex-direction:column; align-items:center; gap:6px; color:#000000; text-decoration:none; cursor:pointer; text-align:center;">
        <span style="font-family:'Poiret One',serif; font-weight:400; font-size:clamp(36px, 4vw, 56px); line-height:1; letter-spacing:0.05em; display:block; text-align:center; margin:0;">Rothbard</span>
        <span style="display:block; text-align:center; margin:0; font-family:'Poiret One',serif; font-weight:400; font-size:clamp(11px, 1.05vw, 15px); line-height:1; letter-spacing:0.42em; padding-left:0.42em; text-transform:uppercase;">Capital</span>
      </a>

  </header>

  <div style="flex:{{ m.bodyFlex }}; min-height:0; display:flex; gap:clamp(16px,2vw,32px); margin-top:58px; border-top:1px solid #D4D4D4; padding-top:20px;">


    <div data-tree="1" style="flex:1; min-width:0; min-height:0; overflow-y:{{ m.treeOverflow }}; display:flex; flex-direction:column; padding-bottom:{{ m.treePadB }};">
      <p style="margin:0 auto 28px; max-width:900px; text-align:center; font-family:'Newsreader',serif; font-size:17px; line-height:1.35; color:#111111; text-wrap:balance; flex-shrink:0;">Rothbard Capital’s character and temperament spring from the Austrian Economic Tradition.</p>
      <sc-for list="{{ gens }}" as="gen" hint-placeholder-count="6">
        <div style="height:{{ m.rowH }}; flex-shrink:0; display:flex;">
          <div style="width:{{ m.labelW }}; flex-shrink:0; white-space:nowrap; font-family:'Poiret One',serif; font-size:{{ m.labelSize }}; color:#6B6B6B; padding-top:{{ m.labelPadT }};"></div>
          <div style="flex:1; position:relative;">
            <sc-for list="{{ gen.pass }}" as="x" hint-placeholder-count="0"><div style="position:absolute; left:{{ x.left }}; top:0; bottom:0; width:1px; background:#9A9A9A;"></div></sc-for>
            <sc-for list="{{ gen.people }}" as="p" hint-placeholder-count="2">
              <div data-person="{{ p.key }}" onMouseEnter="{{ p.hover }}" onClick="{{ p.tap }}" style="position:absolute; left:{{ p.left }}; top:0; bottom:0; width:{{ m.personW }}; max-width:180px; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; text-align:center; cursor:pointer;">
                <div style="width:{{ portrait }}; height:{{ portrait }}; flex-shrink:0; border-radius:50%; overflow:hidden; border:{{ p.border }}; box-shadow:{{ p.shadow }}; background:#E4E2DC; display:flex; align-items:center; justify-content:center; font-family:'Newsreader',serif; font-size:14px; color:#6B6B6B;">
                  <sc-if value="{{ p.hasImg }}" hint-placeholder-val="{{ false }}">
                    <div role="img" aria-label="{{ p.name }}" style="width:100%; height:100%; background-image:{{ p.bg }}; background-size:cover; background-position:50% 20%; filter:{{ p.filter }};"></div>
                  </sc-if>
                  <sc-if value="{{ p.noImg }}" hint-placeholder-val="{{ true }}">
                    <span>{{ p.initials }}</span>
                  </sc-if>
                </div>
                <div style="margin-top:{{ m.nameGap }}; font-family:'Newsreader',serif; font-size:{{ nameSize }}; font-weight:{{ p.weight }}; line-height:1.1; white-space:nowrap; color:{{ p.nameColor }};">{{ p.label }}</div>
                <sc-if value="{{ datesOn }}" hint-placeholder-val="{{ true }}"><div style="font-family:'Figtree',sans-serif; font-size:11px; color:#6B6B6B; line-height:1.3; white-space:nowrap;">{{ p.dates }}</div></sc-if>
                <sc-if value="{{ titlesOn }}" hint-placeholder-val="{{ true }}">
                  <div style="font-family:'Newsreader',serif; font-size:12px; line-height:1.15; color:#333333; text-wrap:balance; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">{{ p.title }}</div>
                </sc-if>
                <div style="flex:1; width:{{ p.stemW }}; background:{{ p.stemColor }}; margin-top:2px;"></div>
              </div>
            </sc-for>
          </div>
        </div>
        <sc-if value="{{ gen.hasConn }}" hint-placeholder-val="{{ true }}">
          <svg viewBox="0 0 1000 16" preserveAspectRatio="none" style="display:block; width:calc(100% - {{ m.labelW }}); margin-left:{{ m.labelW }}; height:{{ m.connH }}; flex-shrink:0; overflow:visible;">
            <path d="{{ gen.conn }}" fill="none" stroke="#9A9A9A" stroke-width="1" vector-effect="non-scaling-stroke"></path>
            <path d="M500 0 V16" fill="none" stroke="#9A9A9A" stroke-width="1" stroke-dasharray="{{ gen.mainDash }}" vector-effect="non-scaling-stroke"></path>
          </svg>
        </sc-if>
      </sc-for>
      <sc-if value="{{ m.on }}" hint-placeholder-val="{{ false }}">
      </sc-if>
    </div>
    <aside style="width:clamp(240px,24vw,320px); flex-shrink:0; border-left:1px solid #D4D4D4; padding-left:clamp(16px,2vw,28px); display:{{ m.asideDisplay }}; flex-direction:column; gap:14px; overflow-y:auto; min-height:0;">
      
      <div style="display:flex; flex-direction:column; gap:10px; align-items:flex-start;">
        <div style="width:112px; height:140px; flex-shrink:0; overflow:hidden; background:#E4E2DC;">
          <image-slot id="{{ sel.detailId }}" shape="rect" src="{{ sel.img }}" placeholder="{{ sel.placeholder }}" style="width:100%; height:100%; display:block; filter:{{ sel.filter }};"></image-slot>
        </div>
        <div style="display:flex; flex-direction:column; gap:3px; min-width:0;">
          <span style="font-family:'Newsreader',serif; font-size:22px; line-height:1.05; color:#000000;">{{ sel.name }}</span>
          <span style="font-family:'Newsreader',serif; font-size:14px; color:#111111;">{{ sel.title }}</span>
          <span style="font-family:'Figtree',sans-serif; font-size:12px; color:#6B6B6B;">{{ sel.dates }}</span>
        </div>
      </div>
      <sc-for list="{{ sel.lines }}" as="ln" hint-placeholder-count="1"><p style="margin:0; font-family:'Newsreader',serif; font-size:17px; line-height:1.35; color:#111111; text-wrap:pretty;">{{ ln.t }}</p></sc-for>
    </aside>
  </div>
</div>
<sc-if value="{{ popOpen }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed; inset:0; z-index:1000; display:flex; flex-direction:column; justify-content:{{ m.popJustify }}; align-items:center;">
    <div onClick="{{ closePop }}" style="position:absolute; inset:0; background:rgba(17,17,17,0.38);"></div>
    <div role="dialog" aria-modal="true" aria-label="{{ sel.name }}" style="position:relative; box-sizing:border-box; width:{{ m.popW }}; max-height:86vh; border:{{ m.popBorder }}; overflow-y:auto; background:#F3F2EE; color:#111111; border-top:1px solid #D4D4D4; padding:22px 22px calc(26px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:14px; box-shadow:0 -8px 30px rgba(0,0,0,0.12);">
      <button type="button" aria-label="Close" onClick="{{ closePop }}" style="position:absolute; top:10px; right:10px; width:40px; height:40px; border:0; background:transparent; padding:0; cursor:pointer; display:flex; align-items:center; justify-content:center; color:#111111;">
        <svg width="18" height="18" viewBox="0 0 18 18" style="display:block;"><path d="M2 2 L16 16 M16 2 L2 16" stroke="#111111" stroke-width="1.4" fill="none"></path></svg>
      </button>
      <div style="display:flex; gap:16px; align-items:flex-end; padding-right:36px;">
        <div style="width:96px; height:120px; flex-shrink:0; overflow:hidden; background:#E4E2DC;">
          <image-slot id="{{ sel.popId }}" shape="rect" src="{{ sel.img }}" placeholder="{{ sel.placeholder }}" style="width:100%; height:100%; display:block; filter:{{ sel.filter }};"></image-slot>
        </div>
        <div style="display:flex; flex-direction:column; gap:3px; min-width:0;">
          <span style="font-family:'Newsreader',serif; font-size:26px; line-height:1.1; color:#000000;">{{ sel.name }}</span>
          <span style="font-family:'Newsreader',serif; font-size:15px; color:#111111;">{{ sel.title }}</span>
          <span style="font-family:'Figtree',sans-serif; font-size:12px; color:#6B6B6B;">{{ sel.dates }}</span>
        </div>
      </div>
      <div style="border-top:1px solid #D4D4D4;"></div>
      <sc-for list="{{ sel.lines }}" as="ln" hint-placeholder-count="1"><p style="margin:0; font-family:'Newsreader',serif; font-size:17px; line-height:1.35; color:#111111; text-wrap:pretty;">{{ ln.t }}</p></sc-for>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;showTitles&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
const P = {
  menger:{name:'Carl Menger',dates:'1840–1921',title:'Father of the Austrian School',wiki:'Carl_Menger',main:1,kids:1,
    why:'Wrote Principles of Economics, launching the marginal revolution.'},
  wieser:{name:'Friedrich von Wieser',dates:'1851–1926',title:'Coined “marginal utility”',wiki:'Friedrich_von_Wieser',kids:1,
    why:'Developed the concept of opportunity cost.'},
  bb:{name:'Eugen von Böhm-Bawerk',dates:'1851–1914',title:'Co-founder of modern capital theory',wiki:'Eugen_von_Böhm-Bawerk',main:1,kids:1,
    why:'Wrote Capital and Interest.'},
  mises:{name:'Ludwig von Mises',dates:'1881–1973',title:'Predicted the end of the USSR',wiki:'Ludwig_von_Mises',main:1,kids:1,
    why:'Wrote Human Action and Economic Calculation in the Socialist Commonwealth.'},
  schumpeter:{name:'Joseph Schumpeter',dates:'1883–1950',title:'Prophet of creative destruction',wiki:'Joseph_Schumpeter',
    why:'Wrote Capitalism, Socialism and Democracy.'},
  hayek:{name:'Friedrich A. Hayek',dates:'1899–1992',title:'Beat the Keynesians',wiki:'Friedrich_Hayek',kids:1,
    why:'Won the 1974 Nobel Prize in Economics.'},
  haberler:{name:'Gottfried Haberler',dates:'1900–1995',title:'Theorist of international trade',wiki:'Gottfried_Haberler',
    why:'Recast trade theory in terms of opportunity cost.'},
  morgenstern:{name:'Oskar Morgenstern',dates:'1902–1977',title:'Co-founder of game theory',wiki:'Oskar_Morgenstern',
    why:'Co-wrote Theory of Games and Economic Behavior.'},
  lachmann:{name:'Ludwig Lachmann',dates:'1906–1990',title:'Radical subjectivist',wiki:'Ludwig_Lachmann',
    why:'Wrote Capital and Its Structure.'},
  machlup:{name:'Fritz Machlup',dates:'1902–1983',title:'Economist of knowledge',
    why:'Measured the “knowledge industry.”'},
  sennholz:{dash:1,img:'./assets/sennholz.jpg',name:'Hans Sennholz',dates:'1922–2007',title:'Mises’s first American PhD',wiki:'Hans_Sennholz',main:1,kids:1,
    why:'Nazi fighter pilot turned Christian. Started Grove City’s Economics Program.'},
  rothbard:{name:'Murray Rothbard',dates:'1926–1995',title:'Mr. Libertarian',wiki:'Murray_Rothbard',kids:1,
    why:'Wrote Man, Economy, and State and The Sociology of the Ayn Rand Cult.'},
  kirzner:{name:'Israel Kirzner',dates:'b. 1930',title:'Theorist of entrepreneurship',wiki:'Israel_Kirzner',
    why:'Wrote Competition and Entrepreneurship.'},
  herbener:{img:'./assets/herbener.jpg',name:'Jeffrey Herbener',dates:'Living',title:'Peterson-Luddy Chair, Mises Institute',wiki:'Jeffrey_Herbener',main:1,kids:1,
    why:'Has led Grove City College’s economics department since 1997.'},
  hoppe:{name:'Hans-Hermann Hoppe',dates:'b. 1949',title:'Rothbard’s protégé',wiki:'Hans-Hermann_Hoppe',
    why:'Wrote Democracy: The God That Failed.'},
  lavoie:{name:'Don Lavoie',dates:'1951–2001',title:'Historian of the calculation debate',wiki:'Don_Lavoie',
    why:'Wrote Rivalry and Central Planning.'},
  walter:{img:'./assets/walt-bw.png',name:'Walt Smith',dates:'b. 1998',title:'General Partner',lead:'Christian. Economics, Grove City College ’21.',note:'Daily Driver: 1974 F-100',main:1,
    why:''}
};
const MX = {wieser:28}; // mobile-only x overrides so short names don't touch
const GENS = [
  {label:'I', people:[['menger',50]], conn:[[50,[33,50]]], mconn:[[50,[MX.wieser,50]]]},
  {label:'II', people:[['wieser',33],['bb',50]], conn:[[50,[50,75]],[28,[28]]]},
  {label:'III', people:[['mises',50],['schumpeter',75]], pass:[28], conn:[[50,[10,28,50,70,90]],[28,[28]]]},
  {label:'IV', people:[['morgenstern',10],['hayek',28],['sennholz',50],['rothbard',70],['kirzner',90]], conn:[[28,[28]],[50,[50]],[70,[70]]]},
  {label:'V', people:[['lachmann',28],['herbener',50],['hoppe',70]], conn:[[50,[50]]]},
  {label:'VI', people:[['walter',50]]}
];
const INK='#9A9A9A', RED='#000000';
class Component extends DCLogic {
  state = { sel:'menger', imgs:{}, open:false };
  onKey = (e) => { if (e.key === 'Escape' && this.state.open) this.setState({open:false}); };
  onResize = () => {
    this.setState({vw:window.innerWidth, vh:window.innerHeight});
    requestAnimationFrame(() => { const t = document.querySelector('[data-tree]'); if (t) { const top = t.getBoundingClientRect().top + window.scrollY; if (Math.abs(top - (this.state.treeTop || 0)) > 1) this.setState({treeTop: top}); } });
  };
  componentWillUnmount(){ window.removeEventListener('resize', this.onResize); window.removeEventListener('keydown', this.onKey); }
  componentDidMount(){
    setTimeout(this.onResize, 600); setTimeout(this.onResize, 1500);
    setTimeout(() => {
      const el = document.querySelector('[data-person="rothbard"]');
      const box = el && el.closest('[data-tree]'); if (box) { const r = el.getBoundingClientRect(), b = box.getBoundingClientRect(); box.scrollTop = Math.max(0, box.scrollTop + (r.top - b.top) + 60 - box.clientHeight / 2); }
    }, 350);
    this.onResize(); window.addEventListener('resize', this.onResize); window.addEventListener('keydown', this.onKey);
    Object.entries(P).forEach(([k,p])=>{
      if(p.img){ this.setState(s=>({imgs:{...s.imgs,[k]:p.img}})); return; }
      if(!p.wiki) return;
      fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(p.wiki))
        .then(r=>r.ok?r.json():null)
        .then(d=>{ const u=d && (d.originalimage?.source || d.thumbnail?.source); if(u) this.setState(s=>({imgs:{...s.imgs,[k]:u}})); })
        .catch(()=>{});
    });
  }
  renderVals(){
    const {sel, imgs, open} = this.state;
    const vw = Math.min(this.state.vw || 1440, 1120), vh = this.state.vh || 900;
    const narrow = (this.state.vw || 1440) < 700; const mobile = true;
    // Mobile: size rows so all six generations fit between the tree top and the fixed bottom nav.
    const connPx = mobile ? 10 : 16;
    const avail = (this.state.vh || 844) - 70 - 10 - (this.state.treeTop || 250) - 28;
    const mRow = Math.max(42, Math.min(68, Math.floor((avail - 5*connPx) / 6)));
    const showPanel = false;
    const treeW = vw - 80 - 44 - (Math.min(320, Math.max(240, vw*0.24)) + 32);
    const rowH = mobile ? mRow : 138;
    const shortNames = treeW * 0.135 < 150;
    const portraitPx = mobile ? Math.max(26, Math.min(40, rowH - 24)) : 60;
    const genOf = {};
    const gens = GENS.map((g,gi)=>{
      const people = g.people.map(([k,x])=>{
        genOf[k]=g.label; const p=P[k]; const on = sel===k;
        const img = imgs[k]||'';
        if (mobile && MX[k] != null) x = MX[k];
        return { ...p, key:k, left:x+'%', img, hasImg:!!img, noImg:!img, hasNote:!!p.note, filter: k==='rothbard' ? 'none' : 'grayscale(1)',
          bg: img ? 'url("'+img+'")' : 'none', initials: p.name.split(' ').filter(w=>/^[A-ZÖ]/.test(w)).map(w=>w[0]).slice(-2).join(''),
          label: shortNames ? (p.short || p.name.split(' ').slice(-1)[0]) : p.name,
          border: '1px solid #111111',
          shadow: (on && (!mobile || open))?`0 0 0 3px #F3F2EE, 0 0 0 4px #000000`:'none',
          nameColor: '#000000', weight: '400',
          stemW: p.kids?'1px':'0', stemColor: p.dash?'repeating-linear-gradient(#9A9A9A 0 4px, transparent 4px 8px)':INK,
          select: ()=>this.state.sel!==k && this.setState({sel:k}),
          hover: mobile ? (()=>{}) : (()=>this.state.sel!==k && this.setState({sel:k})),
          tap: mobile ? (()=>this.setState({sel:k, open:true})) : (()=>this.state.sel!==k && this.setState({sel:k})) };
      });
      const d = ((mobile && g.mconn) || g.conn || []).map(([px,kids])=>{
        const xs=kids.map(x=>x*10), lo=Math.min(px*10,...xs), hi=Math.max(px*10,...xs);
        return `M${px*10} 0 V8 M${lo} 8 H${hi} `+xs.map(x=>`M${x} 8 V16`).join(' ');
      }).join(' ');
      return { label:g.label, people, pass:(g.pass||[]).map(x=>({left:x+'%'})), hasConn: gi<GENS.length-1, conn:d, mainDash: g.label==='IV' ? '4 4' : 'none' };
    });
    const s = P[sel];
    return {
      onHome: (e) => { e && e.preventDefault(); this.props.onHome && this.props.onHome(e); },
      gens,
      popOpen: mobile && open,
      closePop: (e) => { e && e.preventDefault && e.preventDefault(); this.setState({open:false}); },
      m: mobile ? {
        on:true, wrapH:'auto', wrapOverflow:'visible', bodyFlex:'none', wrapPad: narrow ? '32px 14px 10px' : '32px 40px 10px', introSize: narrow ? '15px' : 'clamp(16px,2vh,19px)', introLH:'1.4', treeOverflow:'hidden', treePadB:'0',
        rowH:rowH+'px', labelW:'0px', labelSize:'11px', labelPadT:'10px', personW:'20%', connH:connPx+'px', nameGap:'3px', asideDisplay:'none', popJustify: narrow ? 'flex-end' : 'center', popW: narrow ? '100%' : 'min(560px, 92vw)', popBorder: narrow ? '0' : '1px solid #D4D4D4'
      } : {
        on:false, wrapH:'calc(100vh - 70px)', wrapOverflow:'hidden', bodyFlex:'1', wrapPad:'32px 40px clamp(16px,2.6vh,32px)', introSize:'clamp(17px,2.2vh,21px)', introLH:'1.45', treeOverflow:'auto', treePadB:'30vh',
        rowH:'138px', labelW:'0px', labelSize:'15px', labelPadT:'6px', personW:'15%', connH:'16px', nameGap:'3px', asideDisplay:'flex'
      },
      titlesOn: (this.props.showTitles ?? true) && rowH >= 112,
      showPanel,
      datesOn: !mobile && treeW * 0.135 >= 92,
      portrait: portraitPx+'px',
      nameSize: (mobile ? (rowH >= 56 ? 12 : 11) : treeW * 0.135 < 100 ? 11 : rowH < 80 ? 13 : 15)+'px',
      sel: { ...s, lines:[s.why,s.lead,s.note,s.extra].filter(Boolean).map(t=>({t})), hasNote:!!s.note, hasLead:!!s.lead, hasWhy:!!s.why, filter: sel==='rothbard' ? 'none' : 'grayscale(1)', img:imgs[sel]||'', detailId:'d-'+sel, popId:'m-'+sel, placeholder:sel==='walter'?'Drop your photo':'Portrait',
        genLabel:'Generation '+genOf[sel] }
    };
  }
}
</script>
</body>
</html>
